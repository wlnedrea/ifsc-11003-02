
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3 - Absolute Positioning</title>

    <style>
        html {
            box-sizing: border-box;
        }

        *, *:before, *:after {
            box-sizing: inherit;
        }

        body {
            background-color: #ECECEC;
            font-weight: bold;
            font-family: Tahoma, Geneva, sans-serif;
            color: #FFF;
            text-align: center;
            line-height: 24px;
        }

        #wrapper {
            background-color: #ECECEC;
            border: 1px solid #c0c0c0;
            width: 98vw;
            height: 70vh;
            margin: auto;
            text-shadow: 2px 2px #000;
            position: relative;
        }

        #navy {
            background-color: #001f3f;
            position: absolute;
            width: 100px;
            height: 100px;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #teal {
            background-color: #39CCCC;
            position: absolute;
            width: 100px;
            height: 100px;
            top: 0;
            right: 0;
        }

        #blue {
            background-color: #0074D9;
            position: absolute;
            width: 100px;
            height: 100px;
            bottom: 0;
            left: 0;
        }

        #aqua {
            background-color: #7FDBFF;
            position: absolute;
            width: 100px;
            height: 100px;
            bottom: 0;
            right: 0;
        }

        #footer {
            background-color: #666;
            width: 20%;
            height: 40%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        h1 {
            color: #000;
            font-weight: normal;
            padding: 30px;
        }
    </style>
</head>

<body>
    <h1>Exercise 3</h1>

    <section id="wrapper">
        <div id="navy">Navy</div>
        <div id="teal">Teal</div>
        <div id="blue">Blue</div>
        <div id="aqua">Aqua</div>
        <div id="footer">Footer</div>
    </section>
</body>
</html>
